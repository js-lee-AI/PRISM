name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }}, CPU, base install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the base package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Base import stays light
        run: python -c "import sys, prism; assert 'torch' not in sys.modules, 'torch leaked into the base import'; print(prism.__version__)"
      - name: Quickstart
        run: python examples/quickstart.py
      - name: Command line
        run: |
          prism-merge --help
          prism-merge score data/layer_stats/qwen7b_math_coder.json
      - name: Table 4 from the shipped layer statistics
        run: python experiments/table4_breadth.py
      - name: Tests
        run: pytest -q

  merge:
    name: torch path against the numpy core (CPU torch, merge extra)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU torch, then the package with the merge extra
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[merge,test]"
      - name: The merge extra imports
        run: python -c "import torch, safetensors, transformers, huggingface_hub; print(torch.__version__)"
      - name: Tests, with the torch path against the numpy core
        run: pytest -q -rs

  install:
    name: clean install, used from outside the checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Non-editable install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Import and run away from the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import prism; print(prism.__version__)"
          prism-merge --version
          prism-merge demo
